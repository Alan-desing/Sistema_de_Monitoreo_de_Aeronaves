services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: true
    environment:
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - ./backend:/app
      - backend-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  frontend-node-modules:
